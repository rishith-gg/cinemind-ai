[project]
name = "cinemind"
version = "0.1.0"
description = "CineMind AI: local-first AI-assisted pre-editing for filmmakers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142,<1",
    "uvicorn>=0.54,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "typer>=0.27,<1",
    "psutil>=7.2,<8",
    "rich>=15.0.0",
    "sqlalchemy>=2.1.3,<2.2",
    "alembic>=1.20,<2",
    "xxhash>=4.0.1",
    "scenedetect>=0.7.1,<0.8",
    "opentimelineio>=0.18.1,<0.19",
    "opencv-python>=5.0,<6",
    "numpy>=2.0,<3",
    "faster-whisper>=1.2.1,<2",
    "scikit-learn>=1.9,<2",
    "huggingface-hub>=2.2,<3",
    "scipy>=1.15,<2",
    "torch>=2.14,<3",
    "transformers>=5.19,<6",
    "faiss-cpu>=1.15,<2",
    "sentencepiece>=0.2.2,<0.3",
]

[project.scripts]
cinemind = "cinemind.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<1",
    "pyright>=1.1.414",
    "httpx2>=2.13.1",
    "otio-fcp-adapter>=1.0.0,<2",
    "otio-cmx3600-adapter>=1.0.0,<2",
    "jiwer>=4.0,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/cinemind"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
markers = ["model: needs real model downloads; run on demand"]

[tool.ruff]
line-length = 100
src = ["backend/src", "backend/tests", "eval", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]
"backend/src/cinemind/core/hardware.py" = ["S603"]
"scripts/*" = ["S603"]

[tool.pyright]
include = ["backend/src", "backend/tests", "scripts"]
exclude = ["backend/src/cinemind/db/migrations"]  # Alembic-generated
typeCheckingMode = "strict"
extraPaths = ["backend/src"]

[tool.uv]
link-mode = "copy"

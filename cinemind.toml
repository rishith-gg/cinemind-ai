# CineMind defaults. Override with environment variables (CINEMIND_*) or edit here.
host = "127.0.0.1"          # must stay local; the app refuses anything else
port = 8000
data_dir = "data"           # derived files only; source footage is never touched
media_roots = []            # folders the app may read footage from; set yours in .env (see .env.example)
model_tier = "auto"         # auto | lite | balanced | quality

[transcribe]
model = "auto"              # auto = by tier (lite/balanced: small, quality: large-v3) | tiny | base | small | medium | large-v3
language = "auto"           # auto = detect per clip; or a code such as "en", "hi", "ta", "kn"

[faces]
sample_fps = 2.0            # frames per second searched for faces
cluster_method = "agglomerative"   # agglomerative | hdbscan
cluster_distance = 0.6      # agglomerative only; lower = stricter (more, purer groups); press "Group again" on the Actors page after changing

[rough_cut]
default_target_s = 60.0     # length when the brief names none
min_quality = 0.5           # shots below this Technical Quality Score are left out
max_clip_s = 6.0            # longest clip without speech
min_clip_s = 1.5            # shorter shots are not used
order = "chronological"     # chronological | scene | score (when the brief names none)

[script]
# Script alignment (Script page). Chosen on the Tears of Steel development half: eval/script_align.py
lexical_weight = 0.0        # weight of word similarity in the match score
semantic_weight = 1.0       # weight of meaning similarity (text model); words still set in/out points
min_score = 0.3             # a line's best take must reach this to be used
words_only_min_score = 0.45 # the limit when the text model is not downloaded

[takes]
# Take groups (Takes page). Conventions, not tuned: see EVALUATION.md section 13 and eval/take_groups.py
text_min = 0.6              # two shots with speech are takes when their words agree at least this much
picture_min = 0.9           # shots without speech need pictures this alike ...
max_apart = 3               # ... and at most this many shots apart in file-name order
group_min = 0.75            # mean pair score needed to join a group
